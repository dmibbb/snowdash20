<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnowDash: 20th Anniversary Edition</title>
  </head>
  <body>
  <div id="app">
    <header class="game-header">
      <h1>SnowDash</h1>
      <p>20th Anniversary Edition</p>
    </header>

    <div class="game-body">
      <aside class="controls">
        <h2>Controls</h2>
        <dl>
          <dt>Navigation</dt>
          <dd>WASD / ⬆⬅⬇➡</dd>
          <dt>Pause (in-game)</dt>
          <dd>Esc / P</dd>
          <dt>Mute sounds and music</dt>
          <dd>M</dd>
          <dt>Next track (in-game)</dt>
          <dd>N</dd>
        </dl>
      </aside>
      <canvas id="game" width="800" height="560"></canvas>
    </div>

    <footer class="site-footer">
      Made with <span class="heart">♥</span> by
      <a href="https://github.com/dmibbb" target="_blank" rel="noopener noreferrer">Димасик</a>
      in 2026
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
